{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="row mt-3">
        <div class="col mx-auto mb-3">
            <h2>Report This Review!</h2>
            <hr />
            <form method="POST">
                {% csrf_token %}
                <p>
                    <label for="reason">Reason?</label>
                    <textarea name="reason" required class="form-control" id="reason"></textarea>
                </p>
                <div class="text-start">
                    <button type="submit" class="btn bg-dark text-white">Submit Report!</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
